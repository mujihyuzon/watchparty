<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>(function(s){s.dataset.zone='11742409',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchParty - Catálogo</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Conexão com o SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Cabeçalho do Site -->
  <header class="navbar">
    <div class="logo">Watch<span>Party</span></div>
    <nav>
      <a href="#" class="active">Início</a>
      <a href="#">Animes</a>
      <a href="#">Filmes</a>
      <a href="#">Séries</a>
      <a href="#">Desenhos</a>
      <a href="#">Doramas</a>
      <a href="#">Mangás</a>
    </nav>
    <div class="user-actions">
      <button id="btn-login" class="btn-primary">Entrar</button>
    </div>
  </header>

  <!-- Banner Principal em Destaque -->
  <section class="hero">
    <div class="hero-content">
      <h1 id="hero-title">Bem-vindo ao WatchParty</h1>
      <p id="hero-desc">Explore animes, filmes, séries, desenhos, doramas e mangás em um só lugar.</p>
      <button class="btn-primary">Explorar</button>
    </div>
  </section>

  <!-- Grid onde os cards de conteúdos serão exibidos -->
  <main class="container">
    <section class="catalog-section">
      <h2>Catálogo Completo</h2>
      <div id="catalog-grid" class="catalog-grid">
        <!-- Os cards criados pelo JavaScript aparecerão aqui -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
