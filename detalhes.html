<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchParty - Detalhes</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- SCRIPT MONETAG -->
  <script>(function(s){s.dataset.zone='11742409',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body style="background-color: #141414; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; min-height: 100vh;">

  <!-- Header -->
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.85); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(5px);">
    <a href="index.html" style="font-size: 26px; font-weight: bold; color: #e50914; text-decoration: none;">WatchParty</a>
    <a href="index.html" style="background: #e50914; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: 600;">← Voltar ao Catálogo</a>
  </header>

  <!-- Main Container -->
  <main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">
    
    <!-- Hero / Poster & Ficha Técnica -->
    <div style="display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 40px; background: #1f1f1f; padding: 25px; border-radius: 12px; border: 1px solid #333;">
      <div style="flex: 0 0 240px; max-width: 100%;">
        <img id="poster-img" src="" alt="Capa" style="width: 100%; border-radius: 8px; aspect-ratio: 2/3; object-fit: cover; background: #2a2a2a;">
      </div>

      <div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; justify-content: center;">
        <span id="categoria-badge" style="display: inline-block; background: #e50914; color: #fff; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; width: fit-content; margin-bottom: 12px;">CARREGANDO...</span>
        
        <h1 id="titulo-principal" style="font-size: 36px; margin: 0 0 10px 0; font-weight: 800;">Carregando...</h1>
        
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: #aaa; font-size: 14px; margin-bottom: 18px;">
          <span id="ano-lancamento" style="color: #46d369; font-weight: bold;">2026</span>
          <span>•</span>
          <span id="duracao-tempo">---</span>
          <span>•</span>
          <span id="avaliacao-nota" style="border: 1px solid #ffb400; color: #ffb400; padding: 1px 8px; border-radius: 3px; font-weight: bold; font-size: 12px;">★ 8.5</span>
        </div>

        <p id="sinopse-texto" style="color: #ccc; line-height: 1.6; font-size: 15px; margin-bottom: 25px;">Carregando informações...</p>

        <!-- Botões de Filmes -->
        <div id="area-botoes-filme" style="display: none; gap: 15px; flex-wrap: wrap;">
          <button id="btn-assistir-filme" style="background: #e50914; color: white; border: none; padding: 12px 28px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">▶ Assistir Filme</button>
          <button id="btn-trailer-filme" style="background: #333; color: white; border: 1px solid #555; padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;">🎬 Ver Trailer</button>
        </div>
      </div>
    </div>

    <!-- Seção de Episódios / Capítulos -->
    <div id="area-episodios-container" style="display: none; margin-bottom: 30px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <h3 id="titulo-secao-eps" style="margin: 0; font-size: 20px; border-left: 4px solid #e50914; padding-left: 10px;">Episódios</h3>
        
        <!-- Seletor de Temporadas -->
        <select id="select-temporada" style="display: none; background: #2a2a2a; color: white; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; outline: none;">
        </select>
      </div>
      
      <div id="grid-episodios" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;"></div>
    </div>

    <!-- Container Player -->
    <div id="container-player" style="margin-top: 30px;">
      <h3 id="titulo-player-ep" style="margin-bottom: 12px; font-size: 18px; color: #ddd;">Exibição</h3>
      <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 1px solid #222;">
        <!-- O player / widget do Telegram será injetado aqui -->
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://odspcuyuwgxljbuqiwjv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OKNl6-y_I-5EASJoBX6sIA_WT9-ZUYh';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let todosEpisodios = [];
    let ehMangaObra = false;
    let tituloObraAtual = '';

    async function carregarDetalhes() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (!id) { window.location.href = 'index.html'; return; }

      const { data: conteudo, error } = await supabaseClient
        .from('conteudos')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !conteudo) {
        document.getElementById('titulo-principal').innerText = 'Conteúdo não encontrado';
        return;
      }

      tituloObraAtual = conteudo.titulo;
      document.getElementById('titulo-principal').innerText = conteudo.titulo;
      document.getElementById('categoria-badge').innerText = conteudo.categoria || 'Geral';
      document.getElementById('poster-img').src = conteudo.capa || '';
      document.getElementById('sinopse-texto').innerText = conteudo.sinopse || 'Nenhuma sinopse cadastrada.';
      document.getElementById('ano-lancamento').innerText = conteudo.ano || '2026';
      document.getElementById('duracao-tempo').innerText = conteudo.duracao || (conteudo.categoria && conteudo.categoria.toLowerCase().includes('filme') ? '2h 00m' : '1 Temp.');
      document.getElementById('avaliacao-nota').innerText = `★ ${conteudo.nota || '8.5'}`;
      document.title = `${conteudo.titulo} - WatchParty`;

      const cat = (conteudo.categoria || '').toLowerCase();
      const isFilme = cat.includes('filme');
      ehMangaObra = cat.includes('manga') || cat.includes('mangá');

      if (isFilme) {
        document.getElementById('area-botoes-filme').style.display = 'flex';
        document.getElementById('area-episodios-container').style.display = 'none';
        
        document.getElementById('btn-assistir-filme').onclick = () => {
          document.getElementById('titulo-player-ep').innerText = `Assistindo Filme: ${conteudo.titulo}`;
          carregarMidiaPlayer(conteudo.video_url || conteudo.url, 'video', conteudo.titulo);
        };
        document.getElementById('btn-trailer-filme').onclick = () => {
          document.getElementById('titulo-player-ep').innerText = `Trailer Oficial: ${conteudo.titulo}`;
          carregarMidiaPlayer(conteudo.trailer_url, 'video', `Trailer de ${conteudo.titulo}`);
        };

        carregarMidiaPlayer(conteudo.video_url || conteudo.url, 'video', conteudo.titulo);
      } else {
        document.getElementById('area-botoes-filme').style.display = 'none';
        document.getElementById('area-episodios-container').style.display = 'block';
        document.getElementById('titulo-secao-eps').innerText = ehMangaObra ? 'Capítulos (PDF)' : 'Episódios';

        const { data: lista } = await supabaseClient
          .from('episodios')
          .select('*')
          .eq('conteudo_id', id)
          .order('numero', { ascending: true });

        todosEpisodios = lista || [];
        configurarSeletorTemporadas();
      }
    }

    function configurarSeletorTemporadas() {
      const selectTemp = document.getElementById('select-temporada');
      selectTemp.innerHTML = '';

      if (todosEpisodios.length === 0) {
        renderizarGrade([]);
        return;
      }

      const temporadas = [...new Set(todosEpisodios.map(item => item.temporada || 1))].sort((a,b) => a - b);

      if (temporadas.length > 1 && !ehMangaObra) {
        selectTemp.style.display = 'inline-block';
        temporadas.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.innerText = `${t}ª Temporada`;
          selectTemp.appendChild(opt);
        });

        selectTemp.onchange = (e) => filtrarEExibirGrade(parseInt(e.target.value));
        filtrarEExibirGrade(temporadas[0]);
      } else {
        selectTemp.style.display = 'none';
        renderizarGrade(todosEpisodios);
      }
    }

    function filtrarEExibirGrade(numTemporada) {
      const epsFiltrados = todosEpisodios.filter(ep => (ep.temporada || 1) === numTemporada);
      renderizarGrade(epsFiltrados);
    }

    function renderizarGrade(lista) {
      const grid = document.getElementById('grid-episodios');
      grid.innerHTML = '';

      if (lista.length === 0) {
        grid.innerHTML = '<p style="color:#aaa; grid-column: 1/-1;">Nenhum episódio cadastrado ainda.</p>';
        return;
      }

      lista.forEach(ep => {
        const btn = document.createElement('button');
        const rotulo = ehMangaObra ? `Capítulo ${ep.numero}` : `Episódio ${ep.numero}`;
        btn.innerText = rotulo;
        
        btn.style.cssText = 'background: #2a2a2a; color: white; border: 1px solid #333; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s;';
        btn.onmouseover = () => btn.style.background = '#e50914';
        btn.onmouseout = () => btn.style.background = '#2a2a2a';

        btn.onclick = () => {
          document.getElementById('titulo-player-ep').innerText = `${ehMangaObra ? 'Lendo' : 'Assistindo'}: ${rotulo}`;
          carregarMidiaPlayer(ep.url, ehMangaObra ? 'manga' : 'video', `${tituloObraAtual} - ${rotulo}`);
        };

        grid.appendChild(btn);
      });

      if (lista.length > 0) {
        const primeiro = lista[0];
        const rotulo = ehMangaObra ? `Capítulo ${primeiro.numero}` : `Episódio ${primeiro.numero}`;
        document.getElementById('titulo-player-ep').innerText = `${ehMangaObra ? 'Lendo' : 'Assistindo'}: ${rotulo}`;
        carregarMidiaPlayer(primeiro.url, ehMangaObra ? 'manga' : 'video', `${tituloObraAtual} - ${rotulo}`);
      }
    }

    function carregarMidiaPlayer(url, tipo, tituloDisplay) {
      const container = document.querySelector('#container-player > div');
      
      if (!url || url.trim() === '') {
        container.innerHTML = `
          <div style="position: absolute; top:0; left: 0; width: 100%; height: 100%; display:flex; justify-content:center; align-items:center; background:#0a0a0a; color:#fff; text-align:center;">
            <div style="background:#181818; padding:30px; border-radius:12px; border:1px solid #333;">
              <h2 style="color:#e50914; margin:0 0 10px 0;">🎬 Conteúdo em breve!</h2>
              <p style="color:#aaa; margin:0;">O link de <b>${tituloDisplay}</b> ainda não foi cadastrado.</p>
            </div>
          </div>`;
        return;
      }

      let urlTratada = url.trim();

      // TRATAMENTO PARA LINK DO TELEGRAM (Widget Oficial)
      if (urlTratada.includes('t.me/')) {
        const match = urlTratada.match(/t\.me\/([^?]+)/);
        const postPath = match ? match[1] : '';

        container.innerHTML = `
          <div id="telegram-widget-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; overflow: auto;">
          </div>
        `;

        const widgetContainer = document.getElementById('telegram-widget-container');
        const script = document.createElement('script');
        script.src = 'https://telegram.org/js/telegram-widget.js?22';
        script.setAttribute('data-telegram-post', postPath);
        script.setAttribute('data-width', '100%');
        script.async = true;

        widgetContainer.appendChild(script);
        return;
      }

      // TRATAMENTO PARA PDF / MANGÁ
      if (tipo === 'manga' && (urlTratada.endsWith('.pdf') || urlTratada.includes('drive.google.com'))) {
        urlTratada = `https://docs.google.com/gview?url=${encodeURIComponent(urlTratada)}&embedded=true`;
      }

      // TRATAMENTO PARA YOUTUBE
      if (urlTratada.includes('youtube.com/watch?v=')) {
        const id = urlTratada.split('v=')[1].split('&')[0];
        urlTratada = `https://www.youtube.com/embed/${id}?autoplay=1`;
      } else if (urlTratada.includes('youtu.be/')) {
        const id = urlTratada.split('youtu.be/')[1].split('?')[0];
        urlTratada = `https://www.youtube.com/embed/${id}?autoplay=1`;
      }

      // PLAYER PADRÃO IFRAME
      container.innerHTML = `
        <iframe src="${urlTratada}" style="position: absolute; top:0; left: 0; width: 100%; height: 100%; border:0;" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      `;
    }

    carregarDetalhes();
  </script>
</body>
</html>
